<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600">
<style>
.box { fill:#f0f4ff; stroke:#333; stroke-width:1.5; }
.text { font-family:Arial; font-size:12px; }
.arrow { stroke:#333; stroke-width:1.2; marker-end:url(#arrowhead); }
</style>

<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" 
  refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" />
  </marker>
</defs>

<!-- Boxes -->
<rect x="50" y="50" width="150" height="40" class="box"/>
<text x="60" y="75" class="text">Send/Receive UI</text>

<rect x="250" y="50" width="180" height="40" class="box"/>
<text x="260" y="75" class="text">SendReceiveSession</text>

<rect x="250" y="120" width="180" height="40" class="box"/>
<text x="260" y="145" class="text">SessionSnapshot</text>

<rect x="500" y="50" width="180" height="40" class="box"/>
<text x="510" y="75" class="text">Connection Factory</text>

<rect x="500" y="120" width="180" height="40" class="box"/>
<text x="510" y="145" class="text">SendReceiveAdapter</text>

<rect x="750" y="120" width="120" height="40" class="box"/>
<text x="760" y="145" class="text">Winlink CMS</text>

<rect x="250" y="200" width="180" height="40" class="box"/>
<text x="260" y="225" class="text">wl2k_secure_login</text>

<rect x="500" y="200" width="180" height="40" class="box"/>
<text x="510" y="225" class="text">Spec Loader</text>

<rect x="500" y="270" width="180" height="40" class="box"/>
<text x="510" y="295" class="text">wl2k_spec.json</text>

<rect x="250" y="300" width="180" height="40" class="box"/>
<text x="260" y="325" class="text">BBS Protocol Adapter</text>

<rect x="250" y="380" width="180" height="40" class="box"/>
<text x="260" y="405" class="text">Message Processing</text>

<rect x="500" y="380" width="180" height="40" class="box"/>
<text x="510" y="405" class="text">SQLite DB</text>

<!-- Arrows -->
<line x1="200" y1="70" x2="250" y2="70" class="arrow"/>
<line x1="340" y1="90" x2="340" y2="120" class="arrow"/>
<line x1="430" y1="70" x2="500" y2="70" class="arrow"/>
<line x1="590" y1="90" x2="590" y2="120" class="arrow"/>
<line x1="680" y1="140" x2="750" y2="140" class="arrow"/>
<line x1="340" y1="160" x2="340" y2="200" class="arrow"/>
<line x1="430" y1="220" x2="500" y2="220" class="arrow"/>
<line x1="590" y1="240" x2="590" y2="270" class="arrow"/>
<line x1="500" y1="290" x2="430" y2="320" class="arrow"/>
<line x1="340" y1="340" x2="340" y2="380" class="arrow"/>
<line x1="430" y1="400" x2="500" y2="400" class="arrow"/>

</svg>
